<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <script>
  (() => {
    /* Existing bookmarks and Supabase email links may use former locale folders. */
    const found=location.pathname.match(/^\/VATRA\/(ua|en)\/(.*)$/);
    if (!found) return;
    const file=found[2]||"index.html";
    const allowed=new Set(["index.html","register.html","forgot.html","reset.html","account.html","terms.html","privacy.html","cookies.html","404.html","offline.html"]);
    if (!allowed.has(file)) return;
    // Existing language preferences always win over old /ua/ or /en/ links.
    // Follow an old link's language only for visitors without a saved choice.
    const key="vatra-language";
    let selected=null;
    try {
      const match=document.cookie.split(";").map(item=>item.trim())
        .find(item=>item.startsWith(key+"="));
      if(match){
        const value=decodeURIComponent(match.slice(key.length+1));
        if(value==="uk"||value==="en")selected=value;
      }
    }catch(_){}
    if(!selected){
      try {
        const value=localStorage.getItem(key);
        if(value==="uk"||value==="en")selected=value;
      }catch(_){}
    }
    if(!selected){
      try{localStorage.setItem(key,found[1]==="en"?"en":"uk");}catch(_){}
    }
    const target="/VATRA/"+(file==="index.html"?"":file);
    location.replace(target+location.search+location.hash);
  })();
  </script><script src="/VATRA/assets/js/host.js"></script><script src="/VATRA/assets/js/errors.js"></script>
  <script src="/VATRA/assets/js/lang.js"></script>

  <meta name="description" content="За цією адресою немає сторінки VATRA. Можливо, посилання неправильне або сторінку переміщено.">
