<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#ffffff">
  <title>404 · VATRA</title>
  <link rel="icon" type="image/svg+xml" href="/VATRA/favicon.svg">
  <link rel="stylesheet" href="/VATRA/assets/css/auth.css">
  <script>
  (() => {
    const path=location.pathname;
    let saved=null;
    try { saved=localStorage.getItem("vatra-language"); } catch(_) {}
    const browser=(navigator.languages?.[0]||navigator.language||"").toLowerCase();
    const lang=path.startsWith("/VATRA/en/")?"en":path.startsWith("/VATRA/ua/")?"ua":
      saved==="en"?"en":saved==="uk"?"ua":browser.startsWith("uk")?"ua":"en";
    location.replace("/VATRA/"+lang+"/404.html");
  })();
  </script>
</head>
<body class="account-page error-page ui-root-error-body-001" data-page="technical-404-fallback">
  <main class="account-main error-main ui-root-error-main-001">
    <section class="account-card error-card ui-root-error-section-001">
      <a class="header-logo vt-root-error-link-001" href="/VATRA/ua/404.html" aria-label="VATRA">
        <img class="ui-root-error-img-001" src="/VATRA/assets/logo/vatra-logo.svg" alt="VATRA" width="1342" height="380">
      </a>
      <h1 class="error-heading vt-root-error-h1-001">404 · VATRA</h1>
      <p class="error-description vt-root-error-paragraph-001">Сторінку не знайдено / Page not found</p>
      <p class="vt-root-error-paragraph-002"><a href="/VATRA/ua/404.html" class="simple-link vt-root-error-link-002">Українська</a> · <a href="/VATRA/en/404.html" class="simple-link vt-root-error-link-003">English</a></p>
    </section>
  </main>
</body>
</html>
