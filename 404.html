<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ВАТРА — сторінку не знайдено</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#263750;font:16px system-ui,sans-serif}main{text-align:center;padding:28px}a{color:#0757f5}</style>
<script>
(function(){
 const old='/VATRA/VATRA/',current='/VATRA/';
 const path=location.pathname;
 if(!path.startsWith(old))return;
 const rest=path.slice(old.length);
 if(!/^(?:|index\.html|auth\.html|register\.html|(?:people|communities)\/[A-Za-z0-9_-]{6,128}\/(?:index\.html)?|lang\/(?:uk|en|pl|de|fr|es|pt|it)\/(?:index\.html)?)$/.test(rest))return;
 const next=rest==='index.html'?'':rest;
 location.replace(current+next+location.search+location.hash);
})();
</script></head><body><main><h1>Сторінку не знайдено</h1><p>Поверніться до соціальної мережі ВАТРА.</p><a href="/VATRA/">На головну</a></main></body></html>
