<body>
<header class="topbar vatra-global-header"><a class="brand mobile-brand" href="#"><span class="brand-icon">В</span><span>ВАТРА</span></a><label class="search"><input placeholder="Пошук"></label><button class="icon-btn notification-button">♧</button><button class="avatar blue account-avatar-trigger">В</button></header>
<div class="layout"><aside class="sidebar"><a class="brand" href="#">ВАТРА</a><nav aria-label="Навігація"><button class="nav active"><span class="nav-icon">⌂</span><span>Мій профіль</span></button><button class="nav"><span class="nav-icon">♧</span><span>Друзі</span></button><button class="nav"><span class="nav-icon">▤</span><span>Новини</span></button><button class="nav"><span class="nav-icon">♧</span><span>Сповіщення</span></button><button class="nav"><span class="nav-icon">☏</span><span>Повідомлення</span></button><button class="nav"><span class="nav-icon">☷</span><span>Спільноти</span></button><button class="nav"><span class="nav-icon">★</span><span>Збережене</span></button><button class="nav"><span class="nav-icon">⚙</span><span>Налаштування</span></button></nav><button class="primary wide create-button">＋ Створити допис</button><footer class="sidebar-footer">© 2026 ВАТРА<br>Правила ВАТРИ</footer></aside>
<main class="main"><section class="heading"><h1>Мій профіль</h1></section><section id="feed" class="feed"><section class="profile-vk-layout"><aside class="profile-vk-sidebar"><section class="profile-vk-card profile-vk-avatar-card"><button class="profile-vk-avatar-open"><span class="avatar profile-vk-photo">В</span></button><button class="primary wide">Редагувати профіль</button><label class="profile-vk-change-photo">Змінити фото</label></section><section class="profile-vk-card profile-vk-friends"><h3>Друзі</h3><div class="profile-vk-friend-grid">Немає</div></section></aside><div class="profile-vk-main"><section class="profile-vk-card profile-vk-overview"><div class="profile-vk-title-row"><h2>Тестовий користувач</h2></div><p class="profile-vk-bio">Тестування переносів тексту та ширини профілю на різних екранах.</p><div class="profile-vk-stats"><div><b>0</b><span>Друзі</span></div><div><b>0</b><span>Дописи</span></div></div></section><section class="profile-vk-card profile-vk-photos"><h3>Мої фотографії</h3><div class="profile-photo-gallery"></div></section><section class="profile-vk-posts"><article class="post"><p class="post-text">Текст допису має бути читабельним на будь-якій ширині.</p></article></section></div></section></section></main></div><nav class="mobile-nav"><button>Профіль</button><button>Друзі</button><button>Новини</button><button>Повідомлення</button><button>Ще</button></nav>
<script>
window.addEventListener('load',()=>{
 const $=s=>document.querySelector(s),rect=s=>$(s).getBoundingClientRect(),sidebar=rect('.sidebar'),main=rect('.main'),avatar=rect('.profile-vk-photo'),head=rect('.vatra-global-header'),nav=rect('.sidebar nav .nav'),width=innerWidth;
 const values={width,clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,headerRight:Math.round(head.right),sidebarVisible:getComputedStyle($('.sidebar')).display!=='none',sidebarRight:Math.round(sidebar.right),mainLeft:Math.round(main.left),avatarW:Math.round(avatar.width),avatarH:Math.round(avatar.height),navRight:Math.round(nav.right),textSize:parseFloat(getComputedStyle($('.post-text')).fontSize),bottomNavVisible:getComputedStyle($('.mobile-nav')).display!=='none'};
 document.documentElement.setAttribute('data-smoke',JSON.stringify(values));
});
</script></body></html>
