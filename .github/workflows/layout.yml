name: VATRA layout and script smoke checks
on:
  push:
    paths:
      - 'VATRA/style.css'
      - 'VATRA/vatra-polish.css'
      - 'VATRA/responsive.css'
      - 'VATRA/index.html'
      - 'VATRA/script.js'
      - 'VATRA/tests/layout-smoke.html'
      - 'VATRA/tests/layout.test.mjs'
      - '.github/workflows/layout.yml'
  pull_request:
    paths:
      - 'VATRA/style.css'
      - 'VATRA/vatra-polish.css'
      - 'VATRA/responsive.css'
      - 'VATRA/index.html'
      - 'VATRA/script.js'
      - 'VATRA/tests/layout-smoke.html'
      - 'VATRA/tests/layout.test.mjs'
      - '.github/workflows/layout.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript parses
        run: |
          node --check VATRA/script.js
          node --check VATRA/vatra-e2ee.js
      - name: Verify responsive layout in headless Chrome
        run: node --test VATRA/tests/layout.test.mjs
