name: VATRA exact logo assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'favicon.svg'
      - 'vatra-header.svg'
      - 'social-preview.svg'
      - 'tools/prepare-vatra-brand.py'
      - '.github/workflows/vatra-brand.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    concurrency:
      group: vatra-brand-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
      - run: python tools/prepare-vatra-brand.py
      - name: Publish exact user logo without black surrounding area
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png vatra-icon.png vatra-header.png favicon.png favicon-small.png social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "brand: regenerate VATRA ribbon V icons and wordmark PNG"
            git push
          fi
