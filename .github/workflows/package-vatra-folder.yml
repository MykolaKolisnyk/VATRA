name: Package VATRA folder

on:
  push:
    branches: [main]
    paths:
      - "VATRA/**"
      - ".github/workflows/package-vatra-folder.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create VATRA folder ZIP
        run: |
          rm -f VATRA-folder.zip
          zip -r VATRA-folder.zip VATRA

      - name: Commit ZIP archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VATRA-folder.zip
          if git diff --cached --quiet; then
            echo "Archive unchanged."
            exit 0
          fi
          git commit -m "Build downloadable VATRA folder ZIP"
          git push
