name: VATRA public SEO pages
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'
permissions:
  contents: write
concurrency:
  group: vatra-public-seo
  cancel-in-progress: false
jobs:
  build-public-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate crawlable public pages and sitemap
        env:
          VATRA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_agvPTuxV0igjxgjfd0JdWw_87GaCUS-
        run: node seo/generate-public-pages.mjs
      - name: Publish updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- people/ communities/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update public VATRA SEO snapshots"
            git push
          fi
