name: Deploy secure VATRA functions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rjasunoawrxvetwadylh
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Require secure deployment token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN secret in the repository settings before deploying."
            exit 1
          fi
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy account lifecycle service
        run: supabase functions deploy vatra-account-lifecycle --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy optional text translation service
        run: supabase functions deploy vatra-translate --project-ref "$PROJECT_REF" --no-verify-jwt
