name: Check VATRA JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/vatra-account-lifecycle/index.ts supabase/functions/vatra-translate/index.ts supabase/functions/vatra-story-cleanup/index.ts
      - name: Test automatic Stories cleanup and path isolation
        run: deno test --allow-env --allow-net supabase/functions/vatra-story-cleanup/index_test.ts
      - name: Validate Python tooling syntax
        run: python3 -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for p in pathlib.Path('tools').rglob('*.py')]"
      - name: Rebuild the single VATRA stylesheet and verify it is current
        run: |
          node tools/build-vatra-css.mjs
          git diff --exit-code -- assets/styles/vatra.css
      - name: Check VATRA source and UI invariants
        run: node tools/check-vatra.mjs
      - name: Audit all tracked folders, source, assets and duplicates
        run: node tools/audit-vatra-repository.mjs
      - name: Verify centralized SVG icons and all navigation entries
        run: node tools/test-vatra-icon-system.mjs
      - name: Validate backend imports and every shared SVG path
        run: node tools/test-vatra-startup-contract.mjs
      - name: Validate VATRA Clips playback, lazy video loading and cleanup
        run: node tools/test-vatra-clips-playback.mjs
      - name: Validate clip social actions and protected database permissions
        run: node tools/test-vatra-clips-social.mjs
      - name: Verify readable typography, clean CSS and page labels
        run: node tools/test-vatra-typography-page-names.mjs
      - name: Test VATRA Stories, birthdays, account page edits and navigation
        run: node tools/test-vatra-social-rework.mjs
      - name: Verify VATRA email and SMS authentication OTP flows
        run: node tools/test-vatra-auth-otp.mjs
      - name: Check shared verification rate limits, recovery UI and ribbon brand assets
        run: node tools/test-vatra-shield-brand.mjs
      - name: Check readable VATRA wordmarks and balanced authentication brand panel
        run: node tools/test-vatra-brand-text.mjs
      - name: Check consolidated VATRA forms, recovery scroll and language order
        run: node tools/test-vatra-auth-unified.mjs
      - name: Verify secure SMTP/SMS provider config and Management API patch
        run: node tools/test-vatra-auth-delivery.mjs
      - name: Check website file paths and repository layout
        run: node tools/check-vatra-layout.mjs
      - name: Check new public preview and core page syntax
        run: node --check vatra-public-preview.js && node --check script.js
      - name: Check SEO generator syntax
        run: node --check tools/build-vatra-seo.mjs
      - name: Test SEO deletion and recovery without touching Supabase
        run: node tools/test-vatra-seo.mjs
