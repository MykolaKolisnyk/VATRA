name: Check VATRA JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check VATRA source and UI invariants
        run: node tools/check-vatra.mjs
      - name: Audit all tracked folders, source, assets and duplicates
        run: node tools/audit-vatra-repository.mjs
      - name: Verify centralized SVG icons and all navigation entries
        run: node tools/test-vatra-icon-system.mjs
      - name: Verify readable typography, clean CSS and page labels
        run: node tools/test-vatra-typography-page-names.mjs
      - name: Check website file paths and repository layout
        run: node tools/check-vatra-layout.mjs
      - name: Check SEO generator syntax
        run: node --check tools/build-vatra-seo.mjs
      - name: Test SEO deletion and recovery without touching Supabase
        run: node tools/test-vatra-seo.mjs
