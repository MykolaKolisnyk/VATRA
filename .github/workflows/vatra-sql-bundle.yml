name: Bundle VATRA SQL scripts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VATRA/*.sql'
      - 'tools/build-vatra-sql-bundle.py'
      - '.github/workflows/vatra-sql-bundle.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    concurrency:
      group: vatra-sql-bundle
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build-vatra-sql-bundle.py
      - name: Publish SQL archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VATRA/VATRA-ALL-SQL.zip
          if ! git diff --cached --quiet; then
            git commit -m "database: package all VATRA SQL with migration warnings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
