name: VATRA browser smoke (desktop and mobile)
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '.github/workflows/vatra-browser-smoke.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '.github/workflows/vatra-browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install a pinned Chromium browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke-test VATRA in Chromium at desktop and mobile sizes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vatra-smoke-http.log 2>&1 &
          node tools/browser-smoke.mjs
      - name: Save browser metrics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vatra-browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: warn
          retention-days: 7
