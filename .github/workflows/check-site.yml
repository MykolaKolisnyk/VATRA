name: Verify VATRA pages
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SEO and site layout
        run: |
          node tools/check-seo.mjs
          node tools/check-layout.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Render all Supabase email templates in English and Ukrainian
        env:
          VATRA_AUDIT_EMAIL_OUTPUT: "1"
        run: go run tools/email-template-audit.go
      - name: Install Playwright browsers for cross-engine UI checks
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Check layout, forms, accessibility and cross-browser rendering
        run: node tools/browser-smoke.mjs
      - name: Check email layout in Chromium Firefox WebKit
        run: node tools/email-browser-audit.mjs
      - name: Save responsive visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vatra-visual-audit
          path: audit-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  scale:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vatra_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vatra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vatra_test -d vatra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PostgreSQL load-test client
        run: npm install --no-save --no-package-lock pg@8.16.3
      - name: Simulate 1000 concurrent account creations without production traffic
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/vatra_test
        run: node tools/scale-audit.mjs
