name: Verify VATRA pages
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SEO and site layout
        run: |
          node tools/check-seo.mjs
          node tools/check-layout.mjs
      - name: Install Playwright Chromium for UI checks
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install chromium --with-deps
      - name: Check layout and forms in Chromium
        run: node tools/browser-smoke.mjs
