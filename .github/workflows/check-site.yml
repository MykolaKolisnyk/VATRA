name: Verify VATRA pages
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  development:
    name: Detect development workspace
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d _development/tests ] && [ -d _development/tools ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: development
    if: needs.development.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check avatar state cache safety
        run: node _development/tests/smoke/avatar-state-cache-smoke.mjs
      - name: Check avatar path query caching
        run: node _development/tests/smoke/avatar-path-cache-smoke.mjs
      - name: Check remembered avatar image race safety
        run: node _development/tests/smoke/avatar-remembered-race-smoke.mjs
      - name: Check profile avatar metadata request deduplication
        run: node _development/tests/smoke/profile-avatar-query-smoke.mjs
      - name: Check Vatryk PNG artwork and system avatar states
        run: node _development/tests/smoke/vatryk-artwork-smoke.mjs
      - name: Check Vatryk first-visit onboarding without production requests
        run: node _development/tests/smoke/onboarding-smoke.mjs
      - name: Check unified dark auto-hiding form scrollbars
        run: node _development/tests/smoke/form-scrollbar-smoke.mjs
      - name: Check original VATRA gifts and fullscreen decorative viewer
        run: node _development/tests/smoke/gift-viewer-smoke.mjs
      - name: Check shared friends and notifications cache
        run: node _development/tests/smoke/shared-social-cache-smoke.mjs
      - name: Check notification request deduplication and session teardown
        run: node _development/tests/smoke/notification-lifecycle-smoke.mjs
      - name: Check notification filter races
        run: node _development/tests/smoke/notification-performance-smoke.mjs
      - name: Check toast validation, automatic dismissal and profile photo feedback
        run: node _development/tests/smoke/toast-ux-smoke.mjs
      - name: Check retired administration console and presence privacy
        run: node _development/tests/smoke/retired-admin-presence-smoke.mjs
      - name: Check comment thread viewer cache
        run: node _development/tests/smoke/comment-page-cache-smoke.mjs
      - name: Check Feed cursor viewer cache
        run: node _development/tests/smoke/feed-page-cache-smoke.mjs
      - name: Check Feed friend/community subscription cache and retry
        run: node _development/tests/smoke/feed-subscriptions-smoke.mjs
      - name: Check AdSense consent and visible slot without live ad requests
        run: node _development/tests/smoke/adsense-slot-smoke.mjs
      - name: Check global Feed search cancellation without production queries
        run: node _development/tests/smoke/feed-global-search-smoke.mjs
      - name: Verify polls and scheduled post contracts
        run: node _development/tests/smoke/post-planning-smoke.mjs
      - name: Audit unpublished multilingual page catalogs
        run: node _development/tests/audit/i18n-coverage-audit.mjs
      - name: Verify staged account lifecycle gateway (no live accounts)
        run: node _development/tests/smoke/account-lifecycle-gateway-smoke.mjs
      - name: Check bounded requests and parallel startup
        run: node _development/tests/smoke/startup-performance-smoke.mjs
      - name: Check external link warnings and attribution
        run: node _development/tests/smoke/external-links-smoke.mjs
      - name: Check SEO and site layout
        run: |
          node _development/tests/audit/check-seo.mjs
          node _development/tests/audit/check-layout.mjs
          node _development/tests/audit/css-cascade-audit.mjs
      - name: Check public Redis identity/verified cache
        run: node _development/tests/smoke/public-cache-smoke.mjs
      - name: Check versioned static and public artwork cache
        run: node _development/tests/smoke/static-cache-smoke.mjs
      - name: Check shared signed media caching
        run: node _development/tests/smoke/media-signed-cache-smoke.mjs
      - name: Check adaptive image preview generation and safe fallback
        run: node _development/tests/smoke/media-preview-smoke.mjs
      - name: Check photo viewer image fit and comment layout
        run: node _development/tests/smoke/media-viewer-layout-smoke.mjs
      - name: Verify photo album UI and private-media RLS design
        run: node _development/tests/smoke/photo-albums-smoke.mjs
      - name: Check per-route lazy loading and feature recovery
        run: node _development/tests/smoke/feature-loader-smoke.mjs
      - name: Check presence heartbeat session lifecycle
        run: node _development/tests/smoke/presence-lifecycle-smoke.mjs
      - name: Check presence RLS read cache and sign-out invalidation
        run: node _development/tests/smoke/presence-read-cache-smoke.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Render all Supabase email templates in English and Ukrainian
        env:
          VATRA_AUDIT_EMAIL_OUTPUT: "1"
        run: go run _development/tests/audit/email-template-audit.go
      - name: Install Playwright browsers for cross-engine UI checks
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Check external link dialog in Chromium Firefox WebKit
        run: node _development/tests/smoke/external-links-browser-smoke.mjs
      - name: Check VATRA Player controls in Chromium Firefox WebKit
        run: node _development/tests/smoke/vatra-player-browser-smoke.mjs
      - name: Check layout, forms, accessibility and cross-browser rendering
        run: node _development/tests/smoke/browser-smoke.mjs
      - name: Check email layout in Chromium Firefox WebKit
        run: node _development/tests/audit/email-browser-audit.mjs
      - name: Save responsive visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vatra-visual-audit
          path: audit-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  native-platforms:
    needs: development
    if: needs.development.outputs.present == 'true'
    name: Native OS UI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install chromium
      - name: Test bilingual VATRA pages on native operating system
        run: node _development/tests/smoke/platform-smoke.mjs

  scale:
    needs: development
    if: needs.development.outputs.present == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vatra_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vatra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vatra_test -d vatra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PostgreSQL load-test client
        run: npm install --no-save --no-package-lock pg@8.16.3
      - name: Simulate 1000 concurrent account creations without production traffic
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/vatra_test
        run: node _development/tests/audit/scale-audit.mjs
      - name: Clone disposable test database for independent photo fixtures
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/postgres
        run: node --input-type=module -e 'import pg from "pg"; const db=new pg.Client({connectionString:process.env.DATABASE_URL}); await db.connect(); try { await db.query("CREATE DATABASE vatra_photo_test TEMPLATE vatra_test"); } finally { await db.end(); }'
      - name: Verify photo descriptions, archive and album moves on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/vatra_photo_test
        run: node _development/tests/smoke/photo-management-rls-smoke.mjs
      - name: Verify member content subscriptions on separate disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/vatra_test
        run: node _development/tests/smoke/member-content-subscriptions-rls-smoke.mjs
      - name: Verify staged lifecycle transitions in a separate disposable database
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/postgres
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          import { readFile } from "node:fs/promises";
          const admin = new pg.Client({connectionString:process.env.DATABASE_URL});
          await admin.connect();
          try { await admin.query("CREATE DATABASE vatra_lifecycle_ci"); } finally { await admin.end(); }
          const db = new pg.Client({connectionString:"postgresql://vatra_test:test_password@localhost:5432/vatra_lifecycle_ci"});
          await db.connect();
          try {
            for (const name of ["ci-fixture","staged","isolated-test","access-ci-fixture","access-staged","access-isolated-test"]) {
              await db.query(await readFile("_development/supabase/vatra-account-lifecycle-"+name+".sql","utf8"));
              console.log("VATRA lifecycle: "+name+" passed");
            }
          } finally { await db.end(); }
          NODE
      - name: Verify staged story views access on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/postgres
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          import {readFile} from "node:fs/promises";
          const admin = new pg.Client({connectionString:process.env.DATABASE_URL});
          await admin.connect();
          try { await admin.query("CREATE DATABASE vatra_story_views_ci"); } finally { await admin.end(); }
          const db = new pg.Client({connectionString:"postgresql://vatra_test:test_password@localhost:5432/vatra_story_views_ci"});
          await db.connect();
          try {
            for (const name of ["ci-fixture","staged","isolated-test"]) {
              await db.query(await readFile("_development/supabase/vatra-story-views-"+name+".sql","utf8"));
              console.log("VATRA story views: "+name+" passed");
            }
          } finally { await db.end(); }
          NODE
      - name: Verify poll RLS and scheduled publishing on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/vatra_test
        run: node _development/tests/smoke/post-planning-rls-smoke.mjs

  minified-assets:
    needs: development
    if: needs.development.outputs.present == 'true'
    name: Build minified VATRA static artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify versioned asset references
        run: node _development/tools/revision-assets.mjs
      - name: Verify lazy module authorization and page ownership
        run: node _development/tests/smoke/section-loading-smoke.mjs
      - name: Install pinned asset minifier
        run: npm install --no-save --no-package-lock esbuild@0.28.2
      - name: Construct deploy-ready static site and update fingerprints
        run: node _development/tools/build-static.mjs
      - name: Upload deploy-ready static artifact
        uses: actions/upload-artifact@v4
        with:
          name: vatra-static-minified
          path: |
            dist/
            build-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
