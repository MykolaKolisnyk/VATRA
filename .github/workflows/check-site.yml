name: Verify VATRA pages
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded Pull Request checks instead of installing three browsers
# again for every small follow-up commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check avatar state cache safety
        run: node tests/smoke/avatar-state-cache-smoke.mjs
      - name: Check avatar path query caching
        run: node tests/smoke/avatar-path-cache-smoke.mjs
      - name: Check remembered avatar image race safety
        run: node tests/smoke/avatar-remembered-race-smoke.mjs
      - name: Check profile avatar metadata request deduplication
        run: node tests/smoke/profile-avatar-query-smoke.mjs
      - name: Check Vatryk PNG artwork and system avatar states
        run: node tests/smoke/vatryk-artwork-smoke.mjs
      - name: Check Vatryk first-visit onboarding without production requests
        run: node tests/smoke/onboarding-smoke.mjs
      - name: Check unified dark auto-hiding form scrollbars
        run: node tests/smoke/form-scrollbar-smoke.mjs
      - name: Check original VATRA gifts and fullscreen decorative viewer
        run: node tests/smoke/gift-viewer-smoke.mjs
      - name: Check shared friends and notifications cache
        run: node tests/smoke/shared-social-cache-smoke.mjs
      - name: Check notification request deduplication and session teardown
        run: node tests/smoke/notification-lifecycle-smoke.mjs
      - name: Check comment thread viewer cache
        run: node tests/smoke/comment-page-cache-smoke.mjs
      - name: Check Feed cursor viewer cache
        run: node tests/smoke/feed-page-cache-smoke.mjs
      - name: Check Feed friend/community subscription cache and retry
        run: node tests/smoke/feed-subscriptions-smoke.mjs
      - name: Check global Feed search cancellation without production queries
        run: node tests/smoke/feed-global-search-smoke.mjs
      - name: Audit unpublished multilingual page catalogs
        run: node tests/audit/i18n-coverage-audit.mjs
      - name: Check SEO and site layout
        run: |
          node tests/audit/check-seo.mjs
          node tests/audit/check-layout.mjs
          node tests/audit/css-cascade-audit.mjs
      - name: Check shared signed media caching
        run: node tests/smoke/media-signed-cache-smoke.mjs
      - name: Check adaptive image preview generation and safe fallback
        run: node tests/smoke/media-preview-smoke.mjs
      - name: Check presence heartbeat session lifecycle
        run: node tests/smoke/presence-lifecycle-smoke.mjs
      - name: Check presence RLS read cache and sign-out invalidation
        run: node tests/smoke/presence-read-cache-smoke.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Render all Supabase email templates in English and Ukrainian
        env:
          VATRA_AUDIT_EMAIL_OUTPUT: "1"
        run: go run tests/audit/email-template-audit.go
      - name: Install Playwright browsers for cross-engine UI checks
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Check layout, forms, accessibility and cross-browser rendering
        run: node tests/smoke/browser-smoke.mjs
      - name: Check email layout in Chromium Firefox WebKit
        run: node tests/audit/email-browser-audit.mjs
      - name: Save responsive visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vatra-visual-audit
          path: audit-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  native-platforms:
    name: Native OS UI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install chromium
      - name: Test bilingual VATRA pages on native operating system
        run: node tests/smoke/platform-smoke.mjs

  scale:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vatra_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vatra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vatra_test -d vatra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PostgreSQL load-test client
        run: npm install --no-save --no-package-lock pg@8.16.3
      - name: Simulate 1000 concurrent account creations without production traffic
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/vatra_test
        run: node tests/audit/scale-audit.mjs
      - name: Verify Messenger RLS and scoped deletion on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://vatra_test:test_password@localhost:5432/vatra_test
        run: node tests/smoke/messenger-rls-smoke.mjs

  minified-assets:
    name: Build minified VATRA static artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify versioned asset references
        run: node tools/revision-assets.mjs
      - name: Verify lazy module authorization and page ownership
        run: node tests/smoke/section-loading-smoke.mjs
      - name: Install pinned asset minifier
        run: npm install --no-save --no-package-lock esbuild@0.28.2
      - name: Construct deploy-ready static site and update fingerprints
        run: node tools/build-static.mjs
      - name: Upload deploy-ready static artifact
        uses: actions/upload-artifact@v4
        with:
          name: vatra-static-minified
          path: |
            dist/
            build-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
