name: Verify VATRA pages
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SEO and site layout
        run: |
          node tools/check-seo.mjs
          node tools/check-layout.mjs
      - name: Install Playwright browsers for cross-engine UI checks
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Check layout, forms, accessibility and cross-browser rendering
        run: node tools/browser-smoke.mjs
      - name: Save responsive visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vatra-visual-audit
          path: audit-screenshots/
          if-no-files-found: ignore
          retention-days: 7
