name: VATRA public search pages
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/build-vatra-seo.mjs"
      - ".github/workflows/vatra-seo.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: vatra-seo-generator
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node tools/build-vatra-seo.mjs
      - name: Publish public profile and community snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A people communities sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "seo: refresh indexable public VATRA pages"
            # The brand generator can push a newer main while SEO pages are
            # being prepared. Rebase this generated snapshot before publishing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent update to main, retrying ($attempt/3)"
              sleep $((attempt * 2))
            done
            echo "Unable to publish VATRA SEO snapshots after three attempts" >&2
            exit 1
          fi
