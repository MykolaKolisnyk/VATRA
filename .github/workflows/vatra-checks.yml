name: VATRA checks

on:
  push:
    paths:
      - 'VATRA/**'
      - '.github/workflows/vatra-checks.yml'
  pull_request:
    paths:
      - 'VATRA/**'
      - '.github/workflows/vatra-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse browser JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          for file in VATRA/auth.js VATRA/script.js VATRA/vatra-backend.js VATRA/vatra-loader.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Run inline VATRA regression checks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';

          const read = (path) => readFileSync(path, 'utf8');
          const index = read('VATRA/index.html');
          const app = read('VATRA/script.js');
          const auth = read('VATRA/auth.js');
          const polish = read('VATRA/vatra-polish.css');
          const authCss = read('VATRA/auth.css');

          for (const path of [
            'VATRA/favicon.svg',
            'VATRA/social-preview.svg',
            'VATRA/vatra-loader.js',
            'VATRA/auth.html',
            'VATRA/register.html'
          ]) assert.ok(existsSync(path), `Missing required asset: ${path}`);

          assert.ok(index.includes('id="notificationDropdown"'), 'Notification popover should exist');
          assert.ok(index.includes('id="accountDropdown"'), 'Account popover should exist');
          assert.ok(index.includes('data-legal-open="rules"'), 'In-app legal links should be wired');
          assert.ok(index.includes('application/ld+json'), 'Structured metadata should exist');
          assert.ok(app.includes('function openInAppLegal'), 'Legal dialog handler should exist');
          assert.ok(app.includes('function getImageEditor'), 'Photo editor should exist');
          assert.ok(app.includes('vatraGuideCompletedAt'), 'Onboarding completion should be persisted');
          assert.ok(app.includes('avatarHistory'), 'Avatar history should be retained');
          assert.ok(auth.includes('recoveryPreviousPair'), 'Recovery CAPTCHA should generate new questions');
          assert.ok(auth.includes('if([\'login\',\'register\'].includes(mode)&&!challengePassed)'), 'CAPTCHA should run before sign-in/sign-up requests');
          assert.ok(polish.includes('.profile-columns'), 'Responsive profile layout should exist');
          assert.ok(polish.includes('.vatra-image-editor'), 'Responsive photo editor styles should exist');
          assert.ok(authCss.includes('.birthday-selects select'), 'Branded birthday controls should exist');
          console.log('VATRA static regression checks passed.');
          NODE
