    <script>
  // The offline fallback can be served for any VATRA URL, including nested ones.
  // Resolve resources from the controlling service worker rather than the missing URL.
  (() => {
    const controller=navigator.serviceWorker?.controller;
    const root=controller?.scriptURL
      ? new URL("./",controller.scriptURL)
      : new URL("./",location.href);
    const base=document.createElement("base");
    base.href=root.href;
    document.head.append(base);
  })();
</script>
