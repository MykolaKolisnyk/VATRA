  <body class="account-page ui-account-body-001" data-page="verify">
    <div id="vatra-auth-loading" class="vatra-auth-loading ui-account-auth-loading-001" role="status" aria-label="Завантаження VATRA" aria-live="polite">

        </div>

    <header class="account-top ui-account-header-001">

        <p id="response" class="response vt-account-paragraph-02" role="status" aria-live="polite" hidden>
